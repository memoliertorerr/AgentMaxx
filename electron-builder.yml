appId: dev.usagemaxx.app
productName: UsageMaxx
copyright: Copyright © 2026 Mehmet Ali Ertorer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
win:
  target:
    - target: nsis
      # One installer for both: electron-builder's multi-arch NSIS installs the build that matches
      # the PC (Intel/AMD, or Windows on ARM such as Snapdragon laptops and Parallels on Apple Silicon).
      arch:
        - x64
        - arm64
  artifactName: UsageMaxx-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: UsageMaxx
  uninstallDisplayName: UsageMaxx
mac:
  target: dir
