appId: dev.agentmaxx.app
productName: AgentMaxx
copyright: Copyright © 2026 Mehmet Ali Ertorer
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
win:
  target:
    - target: nsis
      # Architectures come from the command line (`npm run dist:win` passes --x64 --arm64): a CLI
      # target overrides any arch list here. Both go into one installer, and electron-builder's
      # multi-arch NSIS installs the build that matches the PC (Intel/AMD, or Windows on ARM such
      # as Snapdragon laptops and Parallels on Apple Silicon).
      arch:
        - x64
  artifactName: AgentMaxx-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: AgentMaxx
  uninstallDisplayName: AgentMaxx
  # Pack each architecture as a zip, not 7z. Current 7-Zip compresses ARM64 .exe/.dll files with
  # its ARM64 filter, which the installer's older Nsis7z decoder can't read, and it skipped them
  # without an error: the arm64 install had no AgentMaxx.exe or DLLs. Zip has no such filters,
  # and its unpacker (nsisunz) stops with an error if anything fails. useZip only applies without
  # differential packages, which AgentMaxx doesn't use (there's no auto-update).
  differentialPackage: false
  useZip: true
mac:
  target: dir
