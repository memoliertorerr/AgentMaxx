name: CI

on:
  push:
    branches: [main, 'um/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  package:
    name: package (windows-latest)
    needs: verify
    runs-on: windows-latest
    env:
      # Unsigned build: never look for a code-signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: agentmaxx-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: Show how the installer packs each architecture
        run: |
          $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          $out = Join-Path $env:RUNNER_TEMP 'installer-contents'
          & $sevenZip x (Get-ChildItem dist\AgentMaxx-Setup-*.exe).FullName "-o$out" 'app-*' -r -y | Out-Null
          foreach ($package in Get-ChildItem $out -Recurse -Filter 'app-*') {
            Write-Host "== $($package.Name)"
            & $sevenZip l -slt $package.FullName | Select-String '^Method = ' | Sort-Object -Unique | Out-String | Write-Host
          }
      - name: Smoke-launch the packaged app and screenshot the popup (demo data)
        run: node scripts/smoke-launch.mjs --exe "dist/win-unpacked/AgentMaxx.exe" --screenshot
        env:
          AGENTMAXX_DEMO: '1'
      - name: Install with the real installer and check the x64 app is complete
        run: pwsh scripts/install-check.ps1 -Installer (Get-ChildItem dist\AgentMaxx-Setup-*.exe).FullName -Expected dist\win-unpacked -Arch x64
      - name: Smoke-launch the installed app (demo data)
        run: node scripts/smoke-launch.mjs --exe "$env:LOCALAPPDATA\Programs\AgentMaxx\AgentMaxx.exe" --screenshot --name popup-installed-x64
        env:
          AGENTMAXX_DEMO: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: test-results/*.png
          # A failed smoke run has already failed the job; don't add a second failure.
          if-no-files-found: warn

  package-arm64:
    name: package (windows-11-arm)
    # Needs the combined installer from `package`, to install it on ARM.
    needs: [verify, package]
    runs-on: windows-11-arm
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Build the arm64 app (unpacked)
        run: npx electron-vite build && npx electron-builder --win dir --arm64 --publish never
      - name: Smoke-launch the arm64 app natively and screenshot the popup (demo data)
        run: node scripts/smoke-launch.mjs --exe "dist/win-arm64-unpacked/AgentMaxx.exe" --screenshot --name popup-demo-arm64
        env:
          AGENTMAXX_DEMO: '1'
      - uses: actions/download-artifact@v8
        with:
          name: agentmaxx-installer
          path: installer
      - name: Install with the real installer and check the ARM64 app is complete
        run: pwsh scripts/install-check.ps1 -Installer (Get-ChildItem installer\AgentMaxx-Setup-*.exe).FullName -Expected dist\win-arm64-unpacked -Arch ARM64
      - name: Smoke-launch the installed app natively (demo data)
        run: node scripts/smoke-launch.mjs --exe "$env:LOCALAPPDATA\Programs\AgentMaxx\AgentMaxx.exe" --screenshot --name popup-installed-arm64
        env:
          AGENTMAXX_DEMO: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots-arm64
          path: test-results/*.png
          if-no-files-found: warn
